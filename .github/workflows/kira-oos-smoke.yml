name: KIRA OOS public runner smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kira-oos-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public runner network
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          url='https://www.football-data.co.uk/austria.php'
          with urllib.request.urlopen(url, timeout=20) as r:
              body=r.read()
              print('HTTP', r.status, 'BYTES', len(body), 'FOOTBALL_DATA_REACHABLE', len(body)>1000)
          PY
