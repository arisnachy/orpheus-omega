name: ORPHEUS verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: orpheus-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORPHEUS_RUNTIME_MODE: local
      ORPHEUS_LLM_BACKEND: mock
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install complete application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Verify ADK dependency and application import
        run: |
          python -c "import google.adk; print('google-adk import: OK')"
          python -c "from agent_app.agent import app, root_agent; assert len(root_agent.sub_agents) == 9; print(app.name, root_agent.name, len(root_agent.sub_agents))"
          python -c "from orpheus.agent_topology import get_agent_topology; topology = get_agent_topology(); assert topology['specialist_agent_count'] == 18; assert topology['parallel_groups'] == 4; print(topology['framework'], topology['specialist_agent_count'])"
          python -c "from app.main import adk_readiness; state = adk_readiness(); assert not state['ready']; assert state['backend'] == 'mock'; print('honest mock-mode ADK gate: OK')"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run reproducible mission
        run: python scripts/run_demo.py

      - name: Compile all Python modules
        run: python -m compileall -q app agent_app orpheus scripts tests

      - name: Validate web JavaScript
        run: |
          node --check web/app.js
          node --check web/adk.js

      - name: Verify web asset references and proof UI
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {
              'web/index.html': ('/assets/app.css', '/assets/app.js'),
              'web/adk.html': ('/assets/adk.css', '/assets/adk.js', 'agentList', 'eventMetric', 'Mission Chat'),
          }
          for filename, assets in expected.items():
              html = Path(filename).read_text(encoding='utf-8')
              for asset in assets:
                  if asset not in html:
                      raise SystemExit(f'missing web asset or proof marker in {filename}: {asset}')
          js = Path('web/adk.js').read_text(encoding='utf-8')
          for marker in ('/architecture/agents', '/adk/readiness', '/adk/stream', 'recursor_omega', 'nemesis_omega'):
              if marker not in js:
                  raise SystemExit(f'missing live integration marker in web/adk.js: {marker}')
          print('web asset and proof UI references: OK')
          PY

      - name: Publish machine-readable commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"orpheus/full-verification\",\"description\":\"ORPHEUS full verification: $state\"}"
