name: ORPHEUS verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: orpheus-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORPHEUS_RUNTIME_MODE: local
      ORPHEUS_LLM_BACKEND: mock
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install complete application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Verify ADK dependency and application import
        run: |
          python -c "import google.adk; print('google-adk import: OK')"
          python -c "from agent_app.agent import app, root_agent; print(app.name, root_agent.name, len(root_agent.tools))"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run reproducible mission
        run: python scripts/run_demo.py

      - name: Compile all Python modules
        run: python -m compileall -q app agent_app orpheus scripts tests

      - name: Validate web JavaScript
        run: node --check web/app.js

      - name: Verify web asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          for asset in ('/assets/app.css', '/assets/app.js'):
              if asset not in html:
                  raise SystemExit(f'missing web asset reference: {asset}')
          print('web asset references: OK')
          PY

      - name: Publish machine-readable commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"orpheus/full-verification\",\"description\":\"ORPHEUS full verification: $state\"}"
