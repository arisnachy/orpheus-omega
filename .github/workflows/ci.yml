name: ORPHEUS verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete application dependencies
        run: python -m pip install -e ".[all]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reproducible mission
        run: python scripts/run_demo.py
      - name: Compile all Python modules
        run: python -m compileall -q app agent_app orpheus scripts tests
