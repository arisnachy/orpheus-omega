[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus-omega"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
]
agent = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-genai>=1.0.0,<2.0.0",
]
cloud = [
  "google-cloud-firestore>=2.21,<3.0",
  "google-cloud-pubsub>=2.31,<3.0",
  "google-cloud-storage>=3.2,<4.0",
  "google-cloud-logging>=3.12,<4.0",
]
all = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-genai>=1.0.0,<2.0.0",
  "google-cloud-firestore>=2.21,<3.0",
  "google-cloud-pubsub>=2.31,<3.0",
  "google-cloud-storage>=3.2,<4.0",
  "google-cloud-logging>=3.12,<4.0",
]

[tool.setuptools.packages.find]
include = ["orpheus*", "app*", "agent_app*"]
